<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TLV Bot</title>
    <meta name="description" content="A real Tel Aviv food and coffee list, hand-picked by a lifelong local foodie - not crowd reviews. Tell it what you're craving and where you are." />

    <!-- Social preview: matters since results can be shared straight to
         WhatsApp via the existing share button. Image path is root-relative
         (not a hardcoded host) so it resolves correctly on whichever
         environment (staging/production) actually serves the share. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TLV Bot" />
    <meta property="og:description" content="A real Tel Aviv food and coffee list, hand-picked by a lifelong local foodie - not crowd reviews. Tell it what you're craving and where you are." />
    <meta property="og:image" content="/static/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TLV Bot" />
    <meta name="twitter:description" content="A real Tel Aviv food and coffee list, hand-picked by a lifelong local foodie - not crowd reviews." />

    <!-- PWA: installable as a home-screen app (see public/manifest.webmanifest). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ff5a36" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TLV Bot" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
