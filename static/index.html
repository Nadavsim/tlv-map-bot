<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TLV Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
  />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>📍 TLV Bot</h1>
      <p id="location-status">Requesting your location...</p>
      <div id="mode-toggle" role="group" aria-label="Transport mode">
        <button type="button" data-mode="walking" class="active">🚶 Walk</button>
        <button type="button" data-mode="driving">🚗 Drive</button>
      </div>
    </header>

    <main id="chat-log" aria-live="polite"></main>

    <form id="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="What are you craving? e.g. 'ramen' or 'coffee'"
        autocomplete="off"
        disabled
      />
      <button type="submit" disabled>Send</button>
    </form>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
