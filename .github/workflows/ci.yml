name: CI

# Checks on every pull request, so a problem shows up before a branch is merged
# into staging or main (the deploy workflows run the same checks again).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The app serves static/ and refuses to import without it, so the tests need a build.
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.17.4

      - name: Lint
        run: ruff check .

      - name: Test
        run: JWT_SECRET=ci-only-not-a-real-secret pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint and type-check
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build
